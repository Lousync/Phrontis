<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI教学 · 课程化模式原型 v2（来源锚定 / 两级大纲）</title>
<style>
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f6f7f9; --bg-hover: #ececf0; --bg-tertiary: #f0f1f4;
    --border: #e2e4e9; --text-1: #1f2328; --text-2: #57606a; --text-3: #8b949e;
    --accent: #4f6bed; --accent-soft: rgba(79,107,237,.10); --accent-line: rgba(79,107,237,.42);
    --success: #2da44e; --success-soft: rgba(45,164,78,.12);
    --warn: #bf8700; --warn-soft: rgba(191,135,0,.12);
    --danger: #cf222e; --danger-soft: rgba(207,34,46,.10);
    --ease: cubic-bezier(0.22, 0.68, 0.32, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: #dfe3ea; color: var(--text-1); font-size: 13px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .switcher { position: fixed; top: 10px; left: 16px; display: flex; gap: 4px; align-items: center; z-index: 50; flex-wrap: wrap; max-width: 90vw; }
  .switcher .lb { font-size: 11px; color: #6b7280; margin-right: 4px; user-select: none; }
  .switcher button {
    border: 1px solid #c9cdd6; background: #fff; font-family: inherit; font-size: 11.5px; color: var(--text-2);
    padding: 4px 11px; border-radius: 99px; cursor: pointer; transition: all .15s;
  }
  .switcher button:hover { border-color: var(--accent-line); color: var(--accent); }
  .switcher button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .window {
    width: min(1460px, 98vw); height: min(900px, 92vh); margin-top: 30px;
    background: var(--bg-primary); border: 1px solid #c9cdd6; border-radius: 10px;
    box-shadow: 0 18px 48px rgba(20,30,60,.18); display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar { height: 30px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 10px; gap: 7px; flex-shrink: 0; user-select: none; }
  .titlebar .logo { width: 13px; height: 13px; border-radius: 3px; background: var(--accent); }
  .titlebar .t { font-size: 11px; color: var(--text-2); }
  .titlebar .sp { flex: 1; }
  .titlebar .wc { font-size: 11px; color: var(--text-3); letter-spacing: 3px; }

  .shell { flex: 1; display: flex; min-height: 0; }
  .actbar { width: 46px; flex-shrink: 0; background: var(--bg-secondary); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 3px; user-select: none; }
  .actbar .ai { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); cursor: pointer; position: relative; }
  .actbar .ai:hover { background: var(--bg-hover); color: var(--text-1); }
  .actbar .ai.on { color: var(--accent); background: var(--accent-soft); }
  .actbar .ai.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--accent); }
  .actbar .sep { width: 20px; height: 1px; background: var(--border); margin: 5px 0; }
  .actbar .sp { flex: 1; }

  .stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--bg-primary); display: flex; flex-direction: column; }

  .mtop { height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
  .mtab { border: none; background: none; font-family: inherit; font-size: 12px; color: var(--text-2);
    padding: 5px 11px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .mtab:hover { background: var(--bg-hover); color: var(--text-1); }
  .mtab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .mtop .sp { flex: 1; }
  .ws-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2);
    background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .ws-chip:hover { border-color: var(--accent-line); color: var(--accent); }
  .mode-badge { font-size: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .anchor-badge { font-size: 10px; color: var(--success); background: var(--success-soft); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .mtool { border: none; background: none; font-family: inherit; font-size: 11.5px; color: var(--text-2);
    padding: 5px 9px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .mtool:hover { background: var(--bg-hover); color: var(--text-1); }

  .mbody { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  .vsep { width: 1px; height: 18px; background: var(--border); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; font-family: inherit; font-size: 12px;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .btn.pri { background: var(--accent); color: #fff; } .btn.pri:hover { background: #4257d4; }
  .btn.gh { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-2); }
  .btn.gh:hover { border-color: var(--accent-line); color: var(--accent); }
  .btn.sm { padding: 4px 10px; font-size: 11.5px; border-radius: 7px; }
  .btn.ok { background: var(--success-soft); color: var(--success); border: 1px solid rgba(45,164,78,.35); }

  /* ===== 课程主页 ===== */
  .home-side { width: 236px; flex-shrink: 0; background: var(--bg-secondary); border-right: 1px solid var(--border); overflow-y: auto; }
  .home-side .sec { padding: 12px 14px 6px; font-size: 10.5px; color: var(--text-3); letter-spacing: .5px; }
  .tree-ch { padding: 7px 14px 3px; font-size: 11px; color: var(--text-2); font-weight: 600; }
  .tree-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 22px; border-radius: 7px; margin: 1px 8px; cursor: pointer; font-size: 12px; color: var(--text-1); }
  .tree-item:hover { background: var(--bg-hover); }
  .tree-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tree-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-3); }
  .tree-item .dot.mastered { background: var(--success); }
  .tree-item .dot.learning { background: var(--accent); }
  .tree-item .dot.check { background: var(--warn); }
  .tree-item .dot.review { background: var(--danger); }
  .home-side .ft { border-top: 1px solid var(--border); margin-top: 8px; padding: 7px 14px; font-size: 10.5px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }

  .home-main { flex: 1; min-width: 0; overflow-y: auto; }
  .home-inner { max-width: 880px; margin: 0 auto; padding: 26px 32px 70px; }
  .home-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 8px; }
  .home-head h1 { font-size: 21px; font-weight: 600; }
  .home-goal { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .src-line { font-size: 11.5px; color: var(--text-2); margin-top: 7px; display: flex; align-items: center; gap: 7px; }
  .home-prog { margin-left: auto; text-align: right; }
  .home-prog .num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .home-prog .num small { font-size: 12px; color: var(--text-3); font-weight: 400; }
  .home-prog .pb { width: 130px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 6px; }
  .home-prog .pb i { display: block; height: 100%; background: var(--accent); transition: width .4s var(--ease); }
  .resume { display: flex; align-items: center; gap: 12px; border: 1px solid var(--accent-line); background: var(--accent-soft);
    border-radius: 12px; padding: 14px 16px; margin: 16px 0 12px; }
  .resume .rs-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .resume .rs-tx { flex: 1; min-width: 0; }
  .resume .rs-lb { font-size: 10.5px; color: var(--accent); font-weight: 600; letter-spacing: .4px; }
  .resume .rs-nm { font-size: 14.5px; font-weight: 600; margin-top: 3px; }
  .resume .rs-sub { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }

  /* AI 提议增补（可演进） */
  .proposal { border: 1px solid rgba(191,135,0,.4); background: var(--warn-soft); border-radius: 11px; padding: 12px 15px; margin: 0 0 20px; }
  .proposal .pr-lb { font-size: 10.5px; color: var(--warn); font-weight: 600; letter-spacing: .4px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .proposal .pr-tx { font-size: 12.5px; line-height: 1.7; color: var(--text-1); }
  .proposal .pr-act { display: flex; gap: 8px; margin-top: 10px; }

  .ch-head { display: flex; align-items: center; gap: 9px; padding: 8px 4px; cursor: pointer; user-select: none; }
  .ch-head .chev { width: 12px; height: 12px; color: var(--text-3); transition: transform .18s var(--ease); }
  .ch-head.closed .chev { transform: rotate(-90deg); }
  .ch-head .cn { font-size: 12.5px; font-weight: 600; }
  .ch-head .cm { font-size: 11px; color: var(--text-3); }
  .ch-head .cbar { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-tertiary); overflow: hidden; max-width: 140px; }
  .ch-head .cbar i { display: block; height: 100%; background: var(--accent); }
  .unit { display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: 11px; padding: 11px 15px; margin-bottom: 8px; background: var(--bg-primary); transition: border-color .15s, box-shadow .15s; }
  .unit:hover { border-color: var(--accent-line); box-shadow: 0 3px 12px rgba(79,107,237,.07); }
  .unit .u-no { width: 26px; height: 26px; border-radius: 8px; background: var(--bg-tertiary); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
  .unit.mastered .u-no { background: var(--success-soft); color: var(--success); }
  .unit.learning .u-no { background: var(--accent-soft); color: var(--accent); }
  .unit.review .u-no { background: var(--danger-soft); color: var(--danger); }
  .unit .u-mid { flex: 1; min-width: 0; }
  .unit .u-nm { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .unit .u-goal { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
  .src-badge { font-size: 10px; color: var(--text-3); background: var(--bg-tertiary); border-radius: 4px; padding: 1px 6px; font-weight: 500; }
  .src-badge.ai { color: var(--warn); background: var(--warn-soft); }
  .unit .u-bar { width: 84px; flex-shrink: 0; }
  .unit .u-bar .pb { height: 5px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; }
  .unit .u-bar .pb i { display: block; height: 100%; background: var(--accent); }
  .unit .u-bar .pv { font-size: 10px; color: var(--text-3); margin-top: 3px; text-align: right; }
  .unit .u-acts { display: flex; gap: 6px; flex-shrink: 0; }
  .st { font-size: 10px; border-radius: 5px; padding: 1px 7px; font-weight: 600; }
  .st.todo { background: var(--bg-tertiary); color: var(--text-3); }
  .st.learning { background: var(--accent-soft); color: var(--accent); }
  .st.check { background: var(--warn-soft); color: var(--warn); }
  .st.mastered { background: var(--success-soft); color: var(--success); }
  .st.review { background: var(--danger-soft); color: var(--danger); }

  .empty-hint { border: 1px dashed var(--border); border-radius: 11px; padding: 14px; text-align: center; color: var(--text-3); font-size: 12px; }

  /* ===== 上课 ===== */
  .lesson-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .lesson-head { flex-shrink: 0; padding: 9px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; background: var(--bg-secondary); }
  .lesson-head .kp { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-1); background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
  .lesson-head .kp .ic { width: 12px; height: 12px; color: var(--accent); }
  .lesson-head .sp { flex: 1; }
  .chat-scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 22px 30px 10px; position: relative; }
  .chat-inner { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .u-msg { align-self: flex-end; max-width: 74%; background: var(--accent); color: #fff; border-radius: 13px 13px 4px 13px; padding: 9px 14px; font-size: 13px; line-height: 1.65; }
  .u-msg .qt { display: block; margin-top: 6px; padding-left: 9px; border-left: 2px solid rgba(255,255,255,.5); font-size: 11.5px; opacity: .9; }
  .a-msg { font-size: 13px; line-height: 1.8; color: #2b3138; }
  .a-msg h3 { font-size: 15px; font-weight: 600; color: var(--text-1); margin-bottom: 8px; }
  .a-msg p { margin: 7px 0; } .a-msg b { color: var(--text-1); font-weight: 600; }
  .a-msg ul { margin: 7px 0; } .a-msg li { margin: 4px 0 4px 18px; }
  .a-msg code { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12px; font-family: Consolas, monospace; }
  .a-ops { display: flex; gap: 10px; margin-top: 6px; font-size: 10.5px; color: var(--text-3); flex-wrap: wrap; }
  .a-ops button { border: none; background: none; font-family: inherit; font-size: 10.5px; color: var(--text-3); cursor: pointer; padding: 1px 5px; border-radius: 4px; }
  .a-ops button:hover { color: var(--text-1); background: var(--bg-hover); }

  .qcard { border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 11px; padding: 13px 15px; margin: 8px 0 2px; }
  .qcard .qc-lb { font-size: 10.5px; color: var(--accent); font-weight: 600; letter-spacing: .4px; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .qcard .qc-q { font-size: 13px; font-weight: 600; margin-bottom: 9px; }
  .qcard .opt { display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); background: var(--bg-primary); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; }
  .qcard .opt:hover { border-color: var(--accent-line); }
  .qcard .opt .k { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; flex-shrink: 0; }
  .qcard .opt.right { border-color: var(--success); background: var(--success-soft); }
  .qcard .opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .qcard .fb { margin-top: 9px; font-size: 12px; line-height: 1.7; padding: 9px 12px; border-radius: 8px; display: none; }
  .qcard .fb.ok { background: var(--success-soft); color: #1a7f37; display: block; }
  .qcard .fb.no { background: var(--danger-soft); color: #a40e26; display: block; }

  .verb-bar { position: fixed; z-index: 80; display: none; gap: 2px; background: #1f2328; border-radius: 9px; padding: 4px; box-shadow: 0 8px 24px rgba(20,30,60,.28); }
  .verb-bar button { border: none; background: none; color: #e6e8ec; font-family: inherit; font-size: 11.5px; padding: 5px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .verb-bar button:hover { background: rgba(255,255,255,.14); color: #fff; }

  .qchips { flex-shrink: 0; padding: 2px 30px 0; display: flex; gap: 6px; flex-wrap: wrap; max-width: 740px; margin: 0 auto; width: 100%; }
  .qchip { border: 1px solid var(--border); background: var(--bg-primary); font-family: inherit; font-size: 11px;
    color: var(--text-2); padding: 4px 11px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .qchip:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
  .composer-wrap { flex-shrink: 0; padding: 8px 30px 14px; }
  .composer { max-width: 740px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--border); border-radius: 11px; background: var(--bg-primary); padding: 8px 8px 8px 12px; }
  .composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea { flex: 1; min-height: 26px; max-height: 96px; resize: none; border: none; outline: none; font-family: inherit; font-size: 13px; background: none; color: var(--text-1); }
  .send { width: 34px; height: 34px; border: none; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send:hover { opacity: .88; }

  .rail { width: 268px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--bg-secondary); overflow-y: auto; padding: 14px; }
  .rail .grp { margin-bottom: 18px; }
  .rail .lh { font-size: 10.5px; color: var(--text-3); letter-spacing: .5px; margin-bottom: 8px; }
  .kp-card { border: 1px solid var(--border); background: var(--bg-primary); border-radius: 10px; padding: 12px; }
  .kp-card .nm { font-size: 13.5px; font-weight: 600; }
  .kp-card .gl { font-size: 11.5px; color: var(--text-2); margin-top: 4px; line-height: 1.6; }
  .kp-card .pb { height: 5px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; margin-top: 10px; }
  .kp-card .pb i { display: block; height: 100%; background: var(--accent); }
  .kp-card .pv { font-size: 10.5px; color: var(--text-3); margin-top: 4px; display: flex; justify-content: space-between; }
  .rail .kv { display: flex; align-items: center; font-size: 11.5px; color: var(--text-2); padding: 4px 0; }
  .rail .kv b { margin-left: auto; color: var(--text-1); font-weight: 500; }
  .rail .tip { border: 1px solid var(--danger-soft); background: var(--danger-soft); border-radius: 9px; padding: 9px 11px; font-size: 11.5px; color: #a40e26; line-height: 1.6; }

  /* ===== 检验 ===== */
  .quiz-wrap { flex: 1; min-width: 0; overflow-y: auto; }
  .quiz-inner { max-width: 680px; margin: 0 auto; padding: 28px 32px 70px; }
  .quiz-top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .quiz-top .qp { font-size: 11.5px; color: var(--text-2); }
  .quiz-top .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; }
  .quiz-top .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s var(--ease); }
  .quiz-top .qn { font-size: 11.5px; color: var(--text-3); }
  .quiz-q { font-size: 15.5px; font-weight: 600; line-height: 1.7; margin-bottom: 16px; }
  .quiz-opt { display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; margin-bottom: 9px; cursor: pointer; font-size: 13px; }
  .quiz-opt:hover { border-color: var(--accent-line); }
  .quiz-opt .k { width: 23px; height: 23px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
  .quiz-opt.pick { border-color: var(--accent); background: var(--accent-soft); }
  .quiz-opt.right { border-color: var(--success); background: var(--success-soft); }
  .quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .quiz-exp { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 9px 9px 0; padding: 11px 15px; margin: 13px 0; font-size: 12.5px; line-height: 1.75; color: #3d4db8; }
  .quiz-foot { display: flex; gap: 9px; margin-top: 18px; align-items: center; }
  .quiz-foot .sp { flex: 1; }

  .result { text-align: center; padding: 14px 0 0; }
  .result .ring { width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: conic-gradient(var(--success) var(--deg, 0deg), var(--bg-tertiary) 0); }
  .result .ring .in { width: 82px; height: 82px; border-radius: 50%; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .result .ring .pct { font-size: 22px; font-weight: 700; color: var(--success); }
  .result .ring .lb { font-size: 10px; color: var(--text-3); }
  .result h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .result .sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 20px; }
  .sync { border: 1px solid var(--border); background: var(--bg-secondary); border-radius: 10px; padding: 13px 15px; text-align: left; margin-bottom: 16px; }
  .sync .sr { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; color: var(--text-1); }

function masteredCount(){ return allUnits().filter(u => u.status === 'mastered').length; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderChat(){
  const inner = document.getElementById('chatInner');
  let html = '';
  LESSON_SEED.forEach(m => {
    if (m.who === 'u') html += `<div class="u-msg">${esc(m.text)}</div>`;
    else html += `<div class="a-msg">${m.html}<div class="a-ops"><button data-op="copy">复制</button><button data-op="doc">整理成文档</button><button data-op="trace">调用轨迹</button></div></div>`;
  });
  if (pendingQuick) html += quickCardHtml();
  inner.innerHTML = html;
  if (pendingQuick) bindQuickCard();
  renderChips();
  const sc = document.getElementById('chatScroll');
  sc.scrollTop = sc.scrollHeight;
}

function quickCardHtml(){
  return `<div class="qcard" id="qcard">
    <div class="qc-lb"><svg class="ic" style="width:12px;height:12px"><use href="#i-check"/></svg>快检 · 仅新概念出，一条回答最多一张</div>
    <div class="qc-q">${esc(QUICKCHECK.q)}</div>
    ${QUICKCHECK.opts.map((o,i) => `<div class="opt" data-q="${i}"><span class="k">${'ABCD'[i]}</span>${esc(o)}</div>`).join('')}
    <div class="fb" id="qfb"></div>
  </div>`;
}

function bindQuickCard(){
  const card = document.getElementById('qcard');
  if (!card) return;
  card.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (!opt || card.dataset.done) return;
    const pick = Number(opt.dataset.q);
    card.dataset.done = '1';
    card.querySelectorAll('.opt').forEach(el => {
      const i = Number(el.dataset.q);
      if (i === QUICKCHECK.ans) el.classList.add('right');
      else if (i === pick) el.classList.add('wrong');
    });
    const fb = document.getElementById('qfb');
    const ok = pick === QUICKCHECK.ans;
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✓ 接住了。' : '✗ 再想一步 —— ') + esc(QUICKCHECK.exp)
      + (ok ? '' : '<br>我换个角度再讲一次，你把「时间片 → 影响谁」这条线重新说一遍。');
    const u = unit(curUnit);
    u.mastery = Math.min(1, u.mastery + (ok ? 0.1 : 0.02));
    pendingQuick = false;
    renderChips();
    toast(ok ? '已计入本知识点掌握度' : '已记录，AI 将据错因纠偏');
  });
}

const CHIPS = ['继续', '考我一道', '换个例子', '为什么'];
function renderChips(){
  const box = document.getElementById('qchips');
  if (!box) return;
  if (pendingQuick){ box.innerHTML = ''; return; }
  box.innerHTML = CHIPS.map(c => `<button class="qchip" data-chip="${c}">${c}</button>`).join('');
}

function pushUser(text, quote){
  const inner = document.getElementById('chatInner');
  const el = document.createElement('div');
  el.className = 'u-msg';
  el.innerHTML = esc(text) + (quote ? `<span class="qt">“${esc(quote)}”</span>` : '');
  inner.appendChild(el);
}
function pushAI(html){
  const inner = document.getElementById('chatInner');
  const el = document.createElement('div');
  el.className = 'a-msg';
  el.innerHTML = html + `<div class="a-ops"><button data-op="copy">复制</button><button data-op="doc">整理成文档</button></div>`;
  inner.appendChild(el);
  const sc = document.getElementById('chatScroll'); sc.scrollTop = sc.scrollHeight;
}
function handleComposerSend(){
  const ta = document.getElementById('composerIn');
  const v = ta.value.trim(); if (!v) return;
  pushUser(v); ta.value = '';
  const u = unit(curUnit);
  pushAI(`<h3>接着讲：${esc(u.name)}</h3><p>（原型演示）真实实现里，本节会带着「本课知识点 + 掌握度 ${Math.round(u.mastery*100)}% + 课程目标 + 来源 ${esc(u.source)}」注入模型，从「上好这一课」而不是「答完这一问」出发。</p>`);
}
function bindComposer(){
  const ta = document.getElementById('composerIn'), btn = document.getElementById('composerSend');
  if (!ta) return;
  btn.onclick = handleComposerSend;
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleComposerSend(); } };
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(96, ta.scrollHeight) + 'px'; };
}

/* ================= 视图 ③ 检验 ================= */
function renderQuiz(){
  quizState = { i:0, picked:null, judged:false, correct:0 };
  drawQuizQuestion();
}
function drawQuizQuestion(){
  const s = quizState, q = QUIZ[s.i];
  mb.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-inner">
        <div class="quiz-top">
          <span class="qp">检验 · ${esc(unit(curUnit).name)}</span>
          <span class="bar"><i style="width:${s.i/QUIZ.length*100}%"></i></span>
          <span class="qn">${s.i+1} / ${QUIZ.length}</span>
        </div>
        <div class="quiz-q">${esc(q.q)}</div>
        <div id="quizOpts">
          ${q.opts.map((o,i) => `<div class="quiz-opt" data-opt="${i}"><span class="k">${'ABCD'[i]}</span>${esc(o)}</div>`).join('')}
        </div>
        <div id="quizExp"></div>
        <div class="quiz-foot"><span class="sp"></span><button class="btn pri" id="quizMain" data-mode="submit" disabled style="opacity:.5">提交</button></div>
      </div>
    </div>`;
  const opts = document.getElementById('quizOpts');
  opts.onclick = e => {
    const o = e.target.closest('.quiz-opt'); if (!o || s.judged) return;
    s.picked = Number(o.dataset.opt);
    opts.querySelectorAll('.quiz-opt').forEach(el => el.classList.toggle('pick', el === o));
    const b = document.getElementById('quizMain'); b.disabled = false; b.style.opacity = '1';
  };
  document.getElementById('quizMain').onclick = () => {
    const b = document.getElementById('quizMain');
    if (b.dataset.mode === 'submit'){
      opts.querySelectorAll('.quiz-opt').forEach(el => {
        const i = Number(el.dataset.opt);
        if (i === q.ans) el.classList.add('right');
        else if (i === s.picked) el.classList.add('wrong');
      });
      if (s.picked === q.ans) s.correct++;
      document.getElementById('quizExp').innerHTML = `<div class="quiz-exp"><b>解析：</b>${esc(q.exp)}</div>`;
      s.judged = true;
      b.textContent = (s.i === QUIZ.length-1) ? '查看成绩' : '下一题';
      b.dataset.mode = 'next';
    } else {
      if (s.i < QUIZ.length-1){ s.i++; s.picked = null; s.judged = false; drawQuizQuestion(); }
      else drawQuizResult();
    }
  };
}
function drawQuizResult(){
  const s = quizState;
  const pct = Math.round(s.correct / QUIZ.length * 100);
  const u = unit(curUnit);
  u.mastery = pct/100; u.status = pct >= 80 ? 'mastered' : 'review';
  const wrong = QUIZ.length - s.correct;
  mb.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-inner">
        <div class="result">
          <div class="ring" style="--deg:${pct*3.6}deg"><div class="in"><span class="pct">${pct}%</span><span class="lb">正确率</span></div></div>
          <h2>${pct>=80 ? '本知识点已掌握' : '还需要再走一轮'}</h2>
          <div class="sub">${esc(u.name)} · 答对 ${s.correct} / ${QUIZ.length}${wrong?` · 错题 ${wrong} 道已回流错题本`:''}</div>
          <div class="sync">
            <div class="sr"><svg class="ic"><use href="#i-check"/></svg>掌握度已写回 <code>progress.json</code>：${Math.round(u.mastery*100)}%</div>
            <div class="sr"><svg class="ic"><use href="#i-check"/></svg>单元状态更新为「${ST_LABEL[u.status]}」</div>
            ${wrong ? `<div class="sr"><svg class="ic"><use href="#i-check"/></svg>${wrong} 道错题已进错题本，下节会针对薄弱点复讲</div>` : ''}
            <div class="sr"><svg class="ic"><use href="#i-check"/></svg>下次打开课程主页，进度条与「继续学习」已同步</div>
          </div>
          <div style="display:flex;gap:9px;justify-content:center">
            <button class="btn gh" data-act="redo">重做一遍</button>
            <button class="btn pri" data-goto="home">返回课程主页</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* 大纲编辑：输入改名 / 删除 / 添加 / 补漏 */
mb.addEventListener('input', e => {
  const inp = e.target.closest('[data-uid]');
  if (inp){ const u = unit(inp.dataset.uid); if (u) u.name = inp.value; }
});
mb.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm){ const u = unit(rm.dataset.rm); const c = chapterOf(rm.dataset.rm); if (c && u){ c.units = c.units.filter(x => x.id !== u.id); renderWizard(); } return; }
  const add = e.target.closest('[data-add]');
  if (add){ const c = COURSE.chapters.find(x => x.id === add.dataset.add); const id = 'n' + (allUnits().length + 1);
    c.units.push({ id, name:'新知识点', goal:'（待补充）', status:'todo', mastery:0, source: wiz.source==='free'?'AI 补充':'待核对来源' }); renderWizard(); toast('已添加，改名即写入'); return; }
  const fill = e.target.closest('[data-fill]');
  if (fill){ const nm = fill.dataset.fill.replace(/（.*?）/, ''); const id = 'n' + (allUnits().length + 1);
    COURSE.chapters[2].units.push({ id, name:nm, goal:'（补自考纲，待细化）', status:'todo', mastery:0, source:'考纲补充' });
    COVERAGE.gaps = COVERAGE.gaps.filter(g => g !== fill.dataset.fill); renderWizard(); toast('已补上：' + nm); return; }
  const adopt = e.target.closest('[data-adopt]');
  if (adopt){ const p = PROPOSALS.find(x => x.id === adopt.dataset.adopt); const c = COURSE.chapters.find(x => x.id === p.chapterId);
    c.units.push({ id:'n'+(allUnits().length+1), name:p.name, goal:'（AI 补充，待你确认目标）', status:'todo', mastery:0, source:'AI 补充' });
    PROPOSALS = PROPOSALS.filter(x => x.id !== adopt.dataset.adopt); renderHome(); toast('已加入大纲：' + p.name); return; }
  const ig = e.target.closest('[data-ignore]');
  if (ig){ PROPOSALS = PROPOSALS.filter(x => x.id !== ig.dataset.ignore); renderHome(); toast('已忽略该建议'); return; }
});

document.addEventListener('mouseup', e => {

  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  const scroll = document.getElementById('chatScroll');
  if (!text || !scroll || !scroll.contains(sel.anchorNode) || text.length < 2){ hideVerbBar(); return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  verbBar.dataset.text = text;
  verbBar.style.display = 'flex';
  const w = verbBar.offsetWidth || 300;
  verbBar.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width/2 - w/2)) + 'px';
  verbBar.style.top = Math.max(8, r.top - 44) + 'px';
});
verbBar.addEventListener('mousedown', e => e.preventDefault());
verbBar.onclick = e => {
  const b = e.target.closest('[data-verb]'); if (!b) return;
  const verb = b.dataset.verb, quoted = verbBar.dataset.text;
  hideVerbBar(); window.getSelection().removeAllRanges();
  pushUser('【' + verb + '】', quoted);
  pushAI(`<h3>${esc(verb)}</h3><p>（原型演示）划词动词会把选中片段和「${esc(verb)}」这个教学意图一起发给模型 —— 区别于「问 AI」的只引用不发送。</p>`);
};

/* ================= 路由 ================= */
function go(v){
  view = v; hideVerbBar();
  if (v === 'home') renderHome();
  else if (v === 'lesson') renderLesson();
  else if (v === 'quiz') renderQuiz();
  else if (v === 'wizard') renderWizard();
  syncTabs();
}
document.querySelectorAll('.switcher button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.switcher button').forEach(x => x.classList.toggle('active', x === b));
  go(b.dataset.view);
});
document.querySelectorAll('.mtab[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
document.querySelector('.mtool[data-back="ws"]').onclick = () => toast('回工作区选择页（原型示意）');
document.querySelector('.mtool[data-tool="zen"]').onclick = () => toast('禅模式（原型示意）');

mb.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]'); if (goto){ go(goto.dataset.goto); return; }
  const back = e.target.closest('[data-back]'); if (back){ toast('回工作区选择页（原型示意）'); return; }
  const tool = e.target.closest('[data-tool]'); if (tool){ toast('打开「' + tool.dataset.tool + '」（原型示意）'); return; }
  const ch = e.target.closest('.ch-head');
  if (ch){ const id = ch.dataset.ch; if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); renderHome(); return; }
  const jump = e.target.closest('[data-jump]'); if (jump){ curUnit = jump.dataset.jump; go('lesson'); return; }
  const chip = e.target.closest('[data-chip]');
  if (chip){
    const c = chip.dataset.chip; pushUser(c);
    if (c === '考我一道'){ pendingQuick = true; pushAI('<h3>好，出一道快检</h3><p>这道题只考本节刚讲的那个点：</p>'); renderChat(); toast('快检卡已出，chip 暂隐到答完'); }
    else pushAI(`<h3>${esc(c)}</h3><p>（原型演示）快捷意图 chip = 一键发送教学指令，ask 卡在场时自动隐藏。</p>`);
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act){
    if (act.dataset.act === 'study'){ curUnit = act.dataset.unit; go('lesson'); }
    else if (act.dataset.act === 'check'){ curUnit = act.dataset.unit; go('quiz'); }
    else if (act.dataset.act === 'redo'){ renderQuiz(); }
    return;
  }
  const op = e.target.closest('[data-op]');
  if (op){ toast('「' + op.dataset.op + '」（原型示意）'); return; }
});

go('home');
</script>
