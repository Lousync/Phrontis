<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI教学 · 左栏层级切换（大纲态 ⇄ 课时态）原型</title>
<style>
  :root{
    --bg:#fff;--bg2:#f6f7f9;--hov:#ececf0;--bg3:#f0f1f4;--bd:#e2e4e9;--sel:#e8eefb;
    --t1:#1f2328;--t2:#57606a;--t3:#8b949e;--accent:#4f6bed;--accs:rgba(79,107,237,.10);--accl:rgba(79,107,237,.42);
    --ok:#2da44e;--oks:rgba(45,164,78,.12);--warn:#bf8700;--warns:rgba(191,135,0,.12);--dgr:#cf222e;--dgrs:rgba(207,34,46,.10);
    --ease:cubic-bezier(.22,.68,.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#dfe3ea;color:var(--t1);font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .switcher{position:fixed;top:10px;left:16px;display:flex;gap:4px;align-items:center;z-index:60;flex-wrap:wrap;max-width:94vw}
  .switcher .lb{font-size:11px;color:#6b7280;margin-right:4px}
  .switcher button{border:1px solid #c9cdd6;background:#fff;font-family:inherit;font-size:11.5px;color:var(--t2);padding:4px 11px;border-radius:99px;cursor:pointer;transition:.15s}
  .switcher button:hover{border-color:var(--accl);color:var(--accent)}
  .switcher button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .win{width:min(1360px,98vw);height:min(860px,92vh);margin-top:30px;background:var(--bg);border:1px solid #c9cdd6;border-radius:10px;box-shadow:0 18px 48px rgba(20,30,60,.18);display:flex;flex-direction:column;overflow:hidden}
  .tb{height:30px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:7px;flex-shrink:0}
  .tb .logo{width:13px;height:13px;border-radius:3px;background:var(--accent)}.tb .t{font-size:11px;color:var(--t2)}.tb .sp{flex:1}.tb .wc{font-size:11px;color:var(--t3);letter-spacing:3px}
  .shell{flex:1;display:flex;min-height:0}
  .actbar{width:46px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
  .actbar .ai{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
  .actbar .ai.on{color:var(--accent);background:var(--accs);position:relative}
  .actbar .ai.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
  .actbar .sp{flex:1}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}

  .mtop{height:42px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--bd);background:var(--bg2)}
  .wschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--hov)}
  .seg button{border:none;background:none;font-family:inherit;font-size:11.5px;color:var(--t2);padding:3px 10px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .mtop .sp{flex:1}
  .mtop .mini{font-size:11.5px;color:var(--t2);padding:4px 8px;border-radius:7px;cursor:pointer}
  .mtop .mini:hover{background:var(--hov);color:var(--t1)}

  .body{flex:1;min-height:0;display:flex;overflow:hidden}
  .side{width:268px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
  .side .shead{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--t2);letter-spacing:.3px}
  .side .shead .fb{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;font-weight:500}
  .side .scroll{flex:1;overflow-y:auto;padding:5px 6px 12px;min-height:0}
  .ch{padding:8px 8px 3px;font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:.4px}
  .unit{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--t1)}
  .unit:hover{background:var(--hov)}.unit.on{background:var(--sel)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--t3);flex-shrink:0}
  .dot.mastered{background:var(--ok)}.dot.learning{background:var(--accent)}.dot.review{background:var(--dgr)}
  .st{font-size:9.5px;border-radius:4px;padding:1px 6px;font-weight:600}
  .st.todo{background:var(--bg3);color:var(--t3)}.st.learning{background:var(--accs);color:var(--accent)}.st.mastered{background:var(--oks);color:var(--ok)}.st.review{background:var(--dgrs);color:var(--dgr)}
  .lesson{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--t1)}
  .lesson:hover{background:var(--hov)}.lesson.on{background:var(--sel);font-weight:600}
  .lesson .k{font-size:9.5px;color:var(--t3);margin-left:auto}
  .sidefoot{flex-shrink:0;border-top:1px solid var(--bd);padding:7px 12px;font-size:11px;color:var(--t3);display:flex;align-items:center;gap:6px;cursor:pointer}
  .sidefoot:hover{background:var(--hov);color:var(--t1)}

  .main{flex:1;min-width:0;overflow-y:auto;padding:26px 32px}
  .main h1{font-size:20px;font-weight:600}
  .sub{font-size:12px;color:var(--t2);margin-top:5px}
  .card{border:1px solid var(--bd);border-radius:11px;background:var(--bg);padding:14px 16px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;font-family:inherit;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer}
  .btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:#4257d4}
  .btn.gh{background:var(--bg);border:1px solid var(--bd);color:var(--t2)}.btn.gh:hover{border-color:var(--accl);color:var(--accent)}
  .btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
  .resume{display:flex;align-items:center;gap:12px;border:1px solid var(--accl);background:var(--accs);border-radius:12px;padding:14px 16px;margin-top:16px}
  .resume .ri{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
  .chrow{display:flex;align-items:center;gap:9px;padding:8px 4px}
  .chrow .cn{font-size:12.5px;font-weight:600}.chrow .cm{font-size:11px;color:var(--t3)}
  .chrow .cbar{flex:1;max-width:150px;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden}
  .chrow .cbar i{display:block;height:100%;background:var(--accent)}
  .urow{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:11px;padding:11px 14px;margin-bottom:8px}
  .urow .nm{font-size:13.5px;font-weight:600}.urow .gl{font-size:11.5px;color:var(--t2);margin-top:3px}
  .urow .acts{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* 上课 */
  .lesson-head{flex-shrink:0;padding:9px 18px;border-bottom:1px solid var(--bd);background:var(--bg2);display:flex;align-items:center;gap:9px}
  .lesson-head .kp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px}
  .lesson-head .sp{flex:1}
  .chat{flex:1;min-height:0;display:flex;flex-direction:column}
  .stream{flex:1;overflow-y:auto;padding:20px 28px}
  .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .u{align-self:flex-end;max-width:74%;background:var(--accent);color:#fff;border-radius:13px 13px 4px 13px;padding:8px 13px;font-size:13px;line-height:1.6}
  .a{font-size:13px;line-height:1.8;color:#2b3138}.a h3{font-size:14.5px;color:var(--t1);margin-bottom:6px}.a p{margin:6px 0}
  .foot{flex-shrink:0;padding:9px 28px 14px;border-top:1px solid var(--bd)}
  .foot .row{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .chips{max-width:720px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--bd);background:var(--bg);font-family:inherit;font-size:11px;color:var(--t2);padding:4px 11px;border-radius:99px;cursor:pointer}
  .chip:hover{border-color:var(--accl);color:var(--accent)}
  .inp{flex:1;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;outline:none;background:var(--bg);color:var(--t1)}
  .ebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);font-family:inherit;font-size:12px;color:var(--t2);padding:8px 13px;border-radius:8px;cursor:pointer}
  .ebtn:hover{border-color:var(--dgr);color:var(--dgr)}

  /* 空态（只给引导） */
  .empty{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .empty .bd{max-width:440px;text-align:center}
  .empty .ic8{width:46px;height:46px;border-radius:12px;background:var(--accs);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto}
  .empty h2{font-size:17px;font-weight:600;margin-top:16px}
  .empty p{font-size:12.5px;color:var(--t2);line-height:1.75;margin-top:8px}
  .empty .go{margin-top:18px}
  .empty .hint{margin-top:12px;font-size:11px;color:var(--t3)}

  .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,14px);background:#1f2328;color:#fff;font-size:12px;padding:8px 15px;border-radius:8px;opacity:0;transition:.22s var(--ease);z-index:90;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m5 3 14 9-14 9z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-net" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7.4 6.4 15.8M12 7.4l5.6 8.4"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
</svg>

<div class="switcher">
  <span class="lb">原型视图：</span>
  <button data-v="empty" class="active">① 空态（只给引导）</button>
  <button data-v="home">② 课程主页 · 大纲态</button>
  <button data-v="lesson">③ 进去知识点 · 课时态</button>
</div>

<div class="win">
  <div class="tb"><span class="logo"></span><span class="t">Phrontis</span><span class="sp"></span><span class="wc">— □ ✕</span></div>
  <div class="shell">
    <div class="actbar">
      <div class="ai"><svg class="ic"><use href="#i-code"/></svg></div>
      <div class="ai"><svg class="ic"><use href="#i-net"/></svg></div>
      <div class="ai on"><svg class="ic"><use href="#i-spark"/></svg></div>
      <div class="sp"></div>
      <div class="ai"><svg class="ic"><use href="#i-tool"/></svg></div>
      <div class="ai"><svg class="ic"><use href="#i-set"/></svg></div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COURSE = {
  ws:'考研线性代数',
  chapters:[
    { name:'一、行列式', units:[
      { id:'u1', name:'行列式的概念与阶数', status:'mastered', lessons:[{n:1,kind:'精讲',status:'ended'},{n:2,kind:'习题',status:'ended'}] },
      { id:'u2', name:'行列式的性质', status:'learning', lessons:[{n:1,kind:'精讲',status:'ended'},{n:2,kind:'习题',status:'open'}] },
      { id:'u3', name:'行列式的计算方法', status:'todo', lessons:[] },
    ]},
    { name:'二、矩阵及其运算', units:[
      { id:'u4', name:'矩阵的加法与数乘', status:'todo', lessons:[] },
      { id:'u5', name:'矩阵乘法', status:'todo', lessons:[] },
    ]},
  ],
}
let curUnit = 'u2'
const ST = { todo:'未开始', learning:'学习中', mastered:'已掌握', review:'待复习' }
const unit = id => COURSE.chapters.flatMap(c=>c.units).find(u=>u.id===id)
const statusOf = u => (u.status==='mastered')?u.status:(u.lessons.some(l=>l.status==='open')?'learning':u.status)
const toast = (m)=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

const actbar = `
  <div class="actbar">
    <div class="ai"><svg class="ic"><use href="#i-code"/></svg></div>
    <div class="ai"><svg class="ic"><use href="#i-net"/></svg></div>
    <div class="ai on"><svg class="ic"><use href="#i-spark"/></svg></div>
    <div class="sp"></div>
    <div class="ai"><svg class="ic"><use href="#i-tool"/></svg></div>
    <div class="ai"><svg class="ic"><use href="#i-set"/></svg></div>
  </div>`

function mt(effective){ // effective: 'home' | 'lesson'
  return `
  <div class="mtop">
    <span class="wschip"><svg class="ic" style="color:var(--accent)"><use href="#i-book"/></svg>${COURSE.ws}</span>
    <span class="seg">
      <button class="${effective==='home'?'on':''}" data-goto="home">课程主页</button>
      <button class="${effective==='lesson'?'on':''}" data-goto="lesson">上课</button>
    </span>
    <span class="sp"></span>
    <span class="mini">⋯</span>
  </div>`
}

/* 大纲态左栏 */
function outlineSide(){
  const body = COURSE.chapters.map(c=>`
    <div class="ch">${c.name}</div>
    ${c.units.map(u=>`
      <div class="unit" data-open-unit="${u.id}">
        <span class="dot ${statusOf(u)}"></span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.name}</span>
        <span class="st ${statusOf(u)}">${ST[statusOf(u)]}</span>
      </div>`).join('')}
  `).join('')
  return `
  <div class="side">
    <div class="shead">课程大纲</div>
    <div class="scroll">${body}</div>
    <div class="sidefoot"><svg class="ic" style="width:12px;height:12px"><use href="#i-folder"/></svg>资源管理器（收起）</div>
  </div>`
}

/* 课时态左栏 */
function lessonSide(){
  const u = unit(curUnit)
  const rows = u.lessons.length ? u.lessons.map(l=>`
    <div class="lesson ${l.status==='open'?'on':''}" data-lesson="${l.n}">
      <svg class="ic" style="width:12px;height:12px;color:${l.status==='ended'?'var(--ok)':'var(--accent)'}"><use href="#i-book"/></svg>
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">课时${l.n}·${l.kind}</span>
      <span class="k">${l.status==='ended'?'已结束':'进行中'}</span>
    </div>`).join('') : '<div style="padding:8px;font-size:11.5px;color:var(--t3)">还没有课时，进入即自动开启「课时1」</div>'
  return `
  <div class="side">
    <div class="shead"><svg class="ic" data-back="1" style="cursor:pointer;color:var(--accent)"><use href="#i-left"/></svg>课时 · ${u.name}</div>
    <div class="scroll">${rows}</div>
    <div class="sidefoot"><svg class="ic" style="width:12px;height:12px"><use href="#i-folder"/></svg>资源管理器（收起）</div>
  </div>`
}

/* 空态：只给引导 */
function renderEmpty(){
  document.getElementById('stage').innerHTML = `
    <div class="mtop">
      <span class="wschip"><svg class="ic" style="color:var(--accent)"><use href="#i-book"/></svg>考研线性代数</span>
      <span class="sp"></span>
      <span class="mini">⋯</span>
    </div>
    <div class="empty">
      <div class="bd">
        <div class="ic8"><svg class="ic" style="width:22px;height:22px"><use href="#i-spark"/></svg></div>
        <h2>这个工作区还没有课程大纲</h2>
        <p>先定「学什么」。生成一份课程大纲（章 → 知识点），之后按知识点上课、检验，进度会自己沉淀。</p>
        <div class="go"><button class="btn pri" data-act="gen"><svg class="ic" style="width:13px;height:13px"><use href="#i-spark"/></svg>生成课程大纲</button></div>
        <div class="hint">也可以直接手动编辑 <code>课程.md</code></div>
      </div>
    </div>`
  document.querySelector('[data-act="gen"]')?.addEventListener('click',()=>toast('原型示意：进入建课向导'))
}

/* 课程主页（大纲态） */
function renderHome(){
  const units = COURSE.chapters.flatMap(c=>c.units)
  const total = units.length, done = units.filter(u=>u.status==='mastered').length
  const cont = units.find(u=>u.lessons.some(l=>l.status==='open')) || units.find(u=>u.status!=='mastered')
  document.getElementById('stage').innerHTML = `
    <div class="body-wrap" style="display:flex;flex-direction:column;height:100%">
      ${mt('home')}
      <div class="body">
        ${outlineSide()}
        <div class="main">
          <h1>考研线性代数基础复习</h1>
          <div class="sub">🎯 掌握考研线性代数基础概念、核心方法与综合计算能力 · 已掌握 ${done}/${total} 知识点</div>
          ${cont?`
          <div class="resume">
            <div class="ri"><svg class="ic" style="width:18px;height:18px"><use href="#i-play"/></svg></div>
            <div style="flex:1;min-width:0">
              <div style="font-size:10.5px;font-weight:600;color:var(--accent);letter-spacing:.4px">继续学习</div>
              <div style="font-size:14.5px;font-weight:600;margin-top:3px">${cont.name}</div>
            </div>
            <button class="btn pri" data-open-unit="${cont.id}">继续上课</button>
          </div>`:''}
          <div class="card">
            <div style="font-size:12px;color:var(--t2);line-height:1.7">
              左栏是<b>课程大纲</b>——点任意知识点即可进入它自己的「课时」页。这里不重复列章节，避免两处一样的信息把界面撑满。
            </div>
          </div>
        </div>
      </div>
    </div>`
  bind()
}

/* 上课（课时态） */
function renderLesson(){
  const u = unit(curUnit)
  const last = u.lessons[u.lessons.length-1] || { n:1, kind:'精讲', status:'open' }
  const ended = last.status==='ended'
  document.getElementById('stage').innerHTML = `
    <div class="body-wrap" style="display:flex;flex-direction:column;height:100%">
      ${mt('lesson')}
      <div class="body">
        ${lessonSide()}
        <div class="chat">
          <div class="lesson-head">
            <span class="kp"><svg class="ic" style="width:12px;height:12px;color:var(--accent)"><use href="#i-book"/></svg>${u.name}</span>
            <span class="st ${statusOf(u)}">${ST[statusOf(u)]}</span>
            <span class="sp"></span>
            <button class="btn gh sm" data-finish="${u.id}"><svg class="ic" style="width:12px;height:12px"><use href="#i-flag"/></svg>结束本知识点</button>
          </div>
          <div class="stream"><div class="inner">
            <div class="a"><h3>${u.name} · 课时${last.n}·${last.kind}</h3>
              <p>（原型演示）左栏此刻只显示<b>这个知识点的课时</b>，顶部一个 ◀ 回课程大纲。${ended?'<span style="color:var(--t3)"> 本课时已结束 · 只读</span>':''}</p>
            </div>
            <div class="u">继续讲一下这里的要点</div>
            <div class="a"><p>好，我们在课时${last.n}里继续……</p></div>
          </div></div>
          <div class="foot">
            <div class="chips">
              <button class="chip" data-say="继续">继续</button>
              <button class="chip" data-say="考我一道">考我一道</button>
              <button class="chip" data-say="换个例子">换个例子</button>
            </div>
            <div class="row">
              <input class="inp" placeholder="${ended?'本节已结束（只读）· 要补充请开下一节':'输入…（Enter 发送）'}" ${ended?'disabled':''}>
              <button class="ebtn" data-end ${ended?'disabled style="opacity:.5"':''}><svg class="ic" style="width:12px;height:12px"><use href="#i-stop"/></svg>结束课时</button>
            </div>
          </div>
        </div>
      </div>
    </div>`
  bind()
}

function bind(){
  document.querySelectorAll('[data-open-unit]').forEach(el=>el.onclick=()=>{
    curUnit = el.dataset.openUnit
    const u = unit(curUnit)
    if(!u.lessons.length){ u.lessons.push({n:1,kind:'精讲',status:'open'}); toast('自动开启课时1') }
    renderLesson()
  })
  document.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>renderHome())
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{ el.dataset.goto==='home'?renderHome():renderLesson() })
  document.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>toast('原型示意：打开课时'+el.dataset.lesson))
  document.querySelectorAll('[data-say]').forEach(el=>el.onclick=()=>toast('原型示意：发送「'+el.dataset.say+'」'))
  document.querySelector('[data-end]')?.addEventListener('click',()=>{ const u=unit(curUnit); const last=u.lessons[u.lessons.length-1]; if(last&&last.status==='open'){ last.status='ended'; toast('本节已结束 · 生成交接中…'); renderLesson() } })
  document.querySelector('[data-finish]')?.addEventListener('click',()=>toast('原型示意：先自测 → 生成总结篇'))
}

document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.switcher button').forEach(x=>x.classList.toggle('active',x===b))
  const v=b.dataset.v
  if(v==='empty') renderEmpty()
  else if(v==='home') renderHome()
  else renderLesson()
})
renderEmpty()
</script>
</body>
</html>
