<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI教学 · 课时生命周期与引用网络 原型</title>
<style>
  :root{
    --bg:#fff;--bg2:#f6f7f9;--hov:#ececf0;--bg3:#f0f1f4;--bd:#e2e4e9;
    --t1:#1f2328;--t2:#57606a;--t3:#8b949e;--accent:#4f6bed;--accs:rgba(79,107,237,.10);--accl:rgba(79,107,237,.42);
    --ok:#2da44e;--oks:rgba(45,164,78,.12);--warn:#bf8700;--warns:rgba(191,135,0,.12);--dgr:#cf222e;--dgrs:rgba(207,34,46,.10);
    --ease:cubic-bezier(.22,.68,.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#dfe3ea;color:var(--t1);font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .switcher{position:fixed;top:10px;left:16px;display:flex;gap:4px;align-items:center;z-index:60;flex-wrap:wrap;max-width:94vw}
  .switcher .lb{font-size:11px;color:#6b7280;margin-right:4px}
  .switcher button{border:1px solid #c9cdd6;background:#fff;font-family:inherit;font-size:11.5px;color:var(--t2);padding:4px 11px;border-radius:99px;cursor:pointer;transition:.15s}
  .switcher button:hover{border-color:var(--accl);color:var(--accent)}
  .switcher button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .win{width:min(1460px,98vw);height:min(900px,92vh);margin-top:30px;background:var(--bg);border:1px solid #c9cdd6;border-radius:10px;box-shadow:0 18px 48px rgba(20,30,60,.18);display:flex;flex-direction:column;overflow:hidden}
  .tb{height:30px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:7px;flex-shrink:0}
  .tb .logo{width:13px;height:13px;border-radius:3px;background:var(--accent)}
  .tb .t{font-size:11px;color:var(--t2)}.tb .sp{flex:1}.tb .wc{font-size:11px;color:var(--t3);letter-spacing:3px}
  .shell{flex:1;display:flex;min-height:0}
  .actbar{width:46px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
  .actbar .ai{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
  .actbar .ai.on{color:var(--accent);background:var(--accs);position:relative}
  .actbar .ai.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
  .actbar .sp{flex:1}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .mtop{height:42px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--bd);background:var(--bg2)}
  .wschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--hov)}
  .seg button{border:none;background:none;font-family:inherit;font-size:11.5px;color:var(--t2);padding:3px 10px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .mtop .sp{flex:1}
  .body{flex:1;min-height:0;display:flex;overflow:hidden}
  .col{display:flex;flex-direction:column;min-height:0}
  .side{width:262px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);overflow:hidden}
  .sec{padding:8px 12px;font-size:11px;font-weight:600;color:var(--t2);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
  .sec .chev{width:11px;height:11px;color:var(--t3)}
  .tree{padding:4px 6px 10px}
  .ch{padding:7px 8px 3px;font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:.4px}
  .unit{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--t1)}
  .unit:hover{background:var(--hov)}.unit.on{background:var(--accs);color:var(--accent);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--t3);flex-shrink:0}
  .dot.learning{background:var(--accent)}.dot.mastered{background:var(--ok)}.dot.review{background:var(--dgr)}.dot.finished{background:var(--ok)}
  .st{font-size:9.5px;border-radius:4px;padding:1px 6px;font-weight:600}
  .st.todo{background:var(--bg3);color:var(--t3)}.st.learning{background:var(--accs);color:var(--accent)}.st.ended{background:var(--oks);color:var(--ok)}.st.mastered{background:var(--oks);color:var(--ok)}.st.review{background:var(--dgrs);color:var(--dgr)}
  .lesson{padding:5px 8px 5px 26px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:7px;border-radius:6px;cursor:pointer}
  .lesson:hover{background:var(--hov)}
  .lesson .k{font-size:9.5px;color:var(--t3)}
  .main{flex:1;min-width:0;overflow-y:auto;padding:22px 28px}
  .main h1{font-size:19px;font-weight:600}
  .sub{font-size:12px;color:var(--t2);margin-top:4px}
  .card{border:1px solid var(--bd);border-radius:11px;background:var(--bg);padding:14px 16px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;font-family:inherit;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer}
  .btn.pri{background:var(--accent);color:#fff}.btn.gh{background:var(--bg);border:1px solid var(--bd);color:var(--t2)}
  .btn.gh:hover{border-color:var(--accl);color:var(--accent)}
  .btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
  .btn.ok{background:var(--oks);color:var(--ok);border:1px solid rgba(45,164,78,.35)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  /* 资源管理器树 */
  .fexpl{font-size:12.5px;color:var(--t1)}
  .frow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer}
  .frow:hover{background:var(--hov)}
  .frow .fi{width:13px;height:13px;color:var(--t3)}.frow.dir .fi{color:var(--accent)}
  .frow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .tag{font-size:9px;color:var(--t3);background:var(--bg3);border-radius:4px;padding:0 5px;flex-shrink:0}
  .ind{width:14px;flex-shrink:0}
  .frow .chev{width:10px;height:10px;color:var(--t3);flex-shrink:0}
  .frow.sel{background:var(--accs);color:var(--accent)}
  /* chat */
  .chat{flex:1;min-width:0;display:flex;flex-direction:column}
  .hand{flex-shrink:0;margin:8px 16px 0;border:1px solid var(--bd);border-radius:9px;background:var(--bg2);overflow:hidden}
  .hand .hh{display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:11.5px;color:var(--t2);cursor:pointer}
  .hand .hb{padding:0 12px 11px;font-size:12px;line-height:1.75;color:var(--t1)}
  .hand .hb.hide{display:none}
  .stream{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:14px}
  .inner{max-width:740px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
  .u{align-self:flex-end;max-width:74%;background:var(--accent);color:#fff;border-radius:13px 13px 4px 13px;padding:8px 13px;font-size:13px;line-height:1.6}
  .a{font-size:13px;line-height:1.8;color:#2b3138}
  .a h3{font-size:14.5px;color:var(--t1);margin-bottom:6px}
  .a p{margin:6px 0}
  .jump{display:inline-flex;align-items:center;gap:6px;margin:6px 0;padding:5px 11px;border:1px solid var(--accl);background:var(--accs);border-radius:8px;color:var(--accent);font-size:12px;cursor:pointer}
  .jump:hover{background:rgba(79,107,237,.17)}
  .foot{flex-shrink:0;padding:8px 24px 14px;border-top:1px solid var(--bd)}
  .foot .row{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{border:1px solid var(--bd);background:var(--bg);font-family:inherit;font-size:11px;color:var(--t2);padding:4px 11px;border-radius:99px;cursor:pointer}
  .chip:hover{border-color:var(--accl);color:var(--accent)}
  .inp{flex:1;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;outline:none;background:var(--bg);color:var(--t1)}
  /* process panel */
  .proc{border:1px solid var(--bd);border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:10px}
  .proc .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--bd)}
  .proc .pl{padding:6px 12px 10px;font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:6px}
  .proc .pl .li{display:flex;align-items:center;gap:8px}
  .spin{width:13px;height:13px;border:2px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ro{position:absolute;inset:0;background:rgba(255,255,255,.55);pointer-events:none}
  .readonly-badge{font-size:10px;color:var(--t3);background:var(--bg3);border-radius:5px;padding:1px 7px;font-weight:600}
  /* quiz */
  .qopt{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:9px;padding:10px 13px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
  .qopt:hover{border-color:var(--accl)}.qopt.pick{border-color:var(--accent);background:var(--accs)}
  .qopt.right{border-color:var(--ok);background:var(--oks)}.qopt.wrong{border-color:var(--dgr);background:var(--dgrs)}
  .qk{width:21px;height:21px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .summary{border:1px solid var(--bd);border-left:3px solid var(--ok);border-radius:0 9px 9px 0;background:var(--bg2);padding:12px 15px;font-size:12.5px;line-height:1.8}
  .toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,14px);background:#1f2328;color:#fff;font-size:12px;padding:8px 15px;border-radius:8px;opacity:0;transition:.22s var(--ease);z-index:90;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .note{font-size:11.5px;color:var(--t3);line-height:1.7;margin-top:8px}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m5 3 14 9-14 9z"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-net" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7.4 6.4 15.8M12 7.4l5.6 8.4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
</svg>

<div class="switcher">
  <span class="lb">原型视图：</span>
  <button data-v="ws" class="active">① 工作区（分层目录）</button>
  <button data-v="lesson">② 上课（交接/结束课时）</button>
  <button data-v="ending">③ 结束课时（生成过程）</button>
  <button data-v="finish">④ 知识点收尾（测验→总结）</button>
  <button data-v="jump">⑤ 引用跳转（主动/被动）</button>
</div>

<div class="win">
  <div class="tb"><span class="logo"></span><span class="t">Phrontis</span><span class="sp"></span><span class="wc">— □ ✕</span></div>
  <div class="shell">
    <div class="actbar">
      <div class="ai"><svg class="ic"><use href="#i-code"/></svg></div>
      <div class="ai"><svg class="ic"><use href="#i-net"/></svg></div>
      <div class="ai on"><svg class="ic"><use href="#i-spark"/></svg></div>
      <div class="sp"></div>
      <div class="ai"><svg class="ic"><use href="#i-tool"/></svg></div>
      <div class="ai"><svg class="ic"><use href="#i-set"/></svg></div>
    </div>
    <div class="stage" id="stage" style="position:relative"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const COURSE = {
  ws: '考研线性代数',
  chapters: [
    { name: '一、行列式', units: [
      { id:'u1', name:'行列式的概念与阶数', status:'mastered', finished:true, lessons:[
        { n:1, kind:'精讲', status:'ended' }, { n:2, kind:'习题', status:'ended' } ] },
      { id:'u2', name:'行列式的性质', status:'learning', finished:false, lessons:[
        { n:1, kind:'精讲', status:'ended' }, { n:2, kind:'习题', status:'open' } ] },
      { id:'u3', name:'行列式的计算方法', status:'todo', finished:false, lessons:[] },
    ]},
    { name: '二、矩阵及其运算', units: [
      { id:'u4', name:'矩阵的加法与数乘', status:'todo', finished:false, lessons:[] },
      { id:'u5', name:'矩阵乘法', status:'todo', finished:false, lessons:[] },
    ]},
  ],
}
const FINISHED = { // 已完成知识点的总结篇索引（引用网络用）
  u1: { title:'行列式的概念与阶数', digest:'n 阶行列式的定义、余子式与代数余子式、按行展开。' },
}
let curUnit = 'u2'
let curView = 'ws'

const ST = { todo:'未开始', learning:'学习中', mastered:'已掌握', review:'待复习' }
const unit = id => COURSE.chapters.flatMap(c=>c.units).find(u=>u.id===id)
const chapterOf = id => COURSE.chapters.find(c => c.units.some(u=>u.id===id))
const chNo = id => COURSE.chapters.findIndex(c => c.units.some(u=>u.id===id)) + 1
const folderOf = u => `${chNo(u.id)}·${u.name}`
const toast = (m)=>{ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2000) }

/* ================= 通用外壳 ================= */
function chrome(centerHtml, leftHtml){
  const L = typeof leftHtml === 'function' ? leftHtml() : leftHtml
  const C = typeof centerHtml === 'function' ? centerHtml() : centerHtml
  return `
    <div class="mtop">
      <span class="wschip"><svg class="ic" style="color:var(--accent)"><use href="#i-book"/></svg>${COURSE.ws}</span>
      <span class="seg">
        <button class="on">课程主页</button><button>上课</button>
      </span>
      <span class="sp"></span>
      <span style="font-size:11px;color:var(--t3)">课程模式</span>
    </div>
    <div class="body">
      <div class="col side">${L}</div>
      ${C}
    </div>`
}

/* 左栏：课程大纲 + 资源管理器 */
function leftSide(){
  const chSections = COURSE.chapters.map(c=>`
    <div class="ch">${c.name}</div>
    ${c.units.map(u=>`
      <div class="unit ${u.id===curUnit?'on':''}" data-unit="${u.id}">
        <span class="dot ${u.finished?'finished':u.status}"></span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.name}</span>
        <span class="st ${u.status}">${ST[u.status]??u.status}</span>
      </div>
      ${u.lessons.map(l=>`<div class="lesson" data-lu="${u.id}" data-ln="${l.n}">
        <svg class="ic" style="width:11px;height:11px;color:var(--t3)"><use href="#i-book"/></svg>
        课时${l.n}·${l.kind} <span class="st ${l.status==='ended'?'ended':'learning'}">${l.status==='ended'?'已结束':'进行中'}</span>
      </div>`).join('')}
    `).join('')}
  `).join('')
  return `<div class="sec"><svg class="ic chev"><use href="#i-down"/></svg>课程大纲</div><div class="tree">${chSections}</div>`
}
function explorer(){
  const rows = COURSE.chapters.flatMap(c=>c.units).map(u=>{
    const lessons = u.lessons.map(l=>folderRow(1, `课时${l.n}·${l.kind}`, 'folder')).join('')
    const files = (u.finished?folderFile(1,'总结·'+u.name):'') + folderFile(1,'SOURCES.md') + folderFile(1,'PROFILE.md')
    return folderRow(0, folderOf(u), 'folder', true) + files + lessons
  }).join('')
  return `<div class="sec" style="border-top:1px solid var(--bd)"><svg class="ic chev"><use href="#i-down"/></svg>资源管理器</div>
    <div class="tree fexpl">
      ${folderFile(0,'课程.md')}
      ${folderRow(0,'SOURCES','folder',true)}
      ${rows}
      ${folderRow(0,'自由对话','folder',true)}
    </div>`
}
const folderRow = (lvl, name, cls, open) => `
  <div class="frow ${cls}" style="padding-left:${8+lvl*14}px">
    ${lvl>=0?'<svg class="ic chev"><use href="#i-down"/></svg>':''}
    <svg class="ic fi"><use href="${cls==='dir'?'#i-folder':'#i-folder'}"/></svg>
    <span class="nm">${name}</span>
  </div>`
const folderFile = (lvl, name) => `
  <div class="frow" style="padding-left:${8+lvl*14+14}px"><svg class="ic fi"><use href="#i-file"/></svg><span class="nm">${name}</span></div>`

/* ================= ① 工作区 ================= */
function renderWs(){
  const u = unit(curUnit), ch = chapterOf(curUnit)
  const lessonsHtml = u.lessons.length ? u.lessons.map(l=>`
    <div class="frow" style="padding-left:0;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;justify-content:space-between;cursor:default">
      <span style="display:flex;align-items:center;gap:8px"><svg class="ic" style="color:var(--accent)"><use href="#i-book"/></svg>课时${l.n}·${l.kind}
        <span class="st ${l.status==='ended'?'ended':'learning'}">${l.status==='ended'?'已结束':'进行中'}</span></span>
      <button class="btn sm gh" data-open="${l.n}">${l.status==='ended'?'回看':'继续'}</button>
    </div>`).join('') : '<div class="note">还没有课时——点「开始上课」即自动开启课时1。</div>'
  const canFinish = u.lessons.length>0 && u.lessons.every(l=>l.status==='ended') && !u.finished
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="main">
      <h1>${u.name}</h1>
      <div class="sub">${ch.name} · 文件夹 <code style="font-size:11px;color:var(--accent)">${folderOf(u)}/</code> · 掌握度 ${u.status==='mastered'?'100':u.status==='learning'?'60':'0'}%</div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:8px">课时（线性：上一节结束才能接下一节）</div>
        ${lessonsHtml}
        <div style="margin-top:10px;display:flex;gap:8px">
          ${u.finished ? '<span class="readonly-badge">已收尾 · 只读</span>'
            : `<button class="btn pri" data-start="1"><svg class="ic" style="width:12px;height:12px"><use href="#i-play"/></svg>${u.lessons.length===0?'开始上课（自动开课时1）':'继续上课（自动接下一节）'}</button>`}
          ${canFinish ? '<button class="btn ok" data-finish="1"><svg class="ic" style="width:12px;height:12px"><use href="#i-flag"/></svg>结束本知识点</button>' : ''}
          ${u.finished ? '<button class="btn gh sm" data-reopen="1">回炉复习</button>' : ''}
        </div>
      </div>
      <div class="note">目录：知识点文件夹前缀＝章号（<b>方案 A</b>）→「${folderOf(u)}」，章不单独落盘。</div>
    </div>`, leftSide()+explorer())
  bind()
}
function bind(){
  document.querySelectorAll('[data-unit]').forEach(el=>el.onclick=()=>{curUnit=el.dataset.unit;renderWs()})
  document.querySelectorAll('[data-open],[data-start]').forEach(el=>el.onclick=()=>{curView='lesson';renderLesson()})
  const f=document.querySelector('[data-finish]'); if(f) f.onclick=()=>{curView='finish';renderFinish()}
  const r=document.querySelector('[data-reopen]'); if(r) r.onclick=()=>{unit(curUnit).finished=false;unit(curUnit).status='review';toast('已回炉：状态回到「待复习」');renderWs()}
  const an=document.querySelectorAll('[data-lu]'); an.forEach(el=>el.onclick=()=>{curUnit=el.dataset.lu;curView='lesson';renderLesson(true)})
}

/* ================= ② 上课 / ③ 结束课时 ================= */
function renderLesson(forceReadonly){
  const u = unit(curUnit)
  const last = u.lessons[u.lessons.length-1] || { n:1, kind:'精讲', status:'open' }
  const readonly = forceReadonly || last.status==='ended'
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="col chat">
      <div class="hand">
        <div class="hh" data-hand><svg class="ic chev"><use href="#i-down"/></svg>上节交接（课时${Math.max(1,last.n-1)} 精讲）</div>
        <div class="hb" id="handBody">
          <b>本节要点</b>：行列式按行（列）展开、余子式。<br>
          <b>掌握情况</b>：展开定理会用；代数余子式符号容易错。<br>
          <b>遗留问题</b>：三阶行列式的对角线法则还没练熟。<br>
          <b>下节建议</b>：先补对角线法则，再进「行列式的性质」。
        </div>
      </div>
      <div class="stream"><div class="inner" id="stream">
        <div class="u">继续讲「${u.name}」</div>
        <div class="a"><h3>${u.name} · 本节目标</h3>
          <p>（原型演示）这里会带着「本知识点 + 上节交接」来讲。当前课时：<b>课时${last.n}·${last.kind}</b>${readonly?'（<span class="readonly-badge">已结束 · 只读</span>）':''}。</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
            <button class="chip" data-say="继续">继续</button><button class="chip" data-say="考我一道">考我一道</button><button class="chip" data-say="换个例子">换个例子</button>
          </div>
        </div>
      </div></div>
      <div class="foot">
        <div class="row">
          <input class="inp" placeholder="${readonly?'本节已结束（只读）——要补充请开下一节':'输入…（Enter 发送）'}" ${readonly?'disabled':''}>
          <button class="btn pri" data-end ${readonly?'disabled':''} title="${readonly?'已结束':'结束本节'}"><svg class="ic" style="width:12px;height:12px"><use href="#i-stop"/></svg>结束课时</button>
        </div>
        ${readonly?'':''}
      </div>
    </div>`, leftSide()+explorer())
  document.querySelector('[data-hand]')?.addEventListener('click',()=>{document.getElementById('handBody').classList.toggle('hide')})
  document.querySelectorAll('[data-say]').forEach(el=>el.onclick=()=>{
    const s=document.getElementById('stream'); const d=document.createElement('div'); d.className='u'; d.textContent=el.dataset.say; s.appendChild(d)
    const a=document.createElement('div'); a.className='a'; a.innerHTML='<p>（原型演示）继续讲解中……</p>'; s.appendChild(a); s.scrollTop=s.scrollHeight
  })
  const eb=document.querySelector('[data-end]'); if(eb && !eb.disabled) eb.onclick=()=>{ curView='ending'; renderEnding() }
  bind()
}

function renderEnding(){
  const u = unit(curUnit)
  const last = u.lessons[u.lessons.length-1] || { n:1, kind:'精讲', status:'open' }
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="col chat">
      <div class="stream"><div class="inner">
        <div class="a"><h3>已结束课时${last.n}·${last.kind} <span class="readonly-badge">只读</span></h3>
          <p>本节已冻结，不能再发消息——要补充请开下一节。</p>
          <div class="proc">
            <div class="ph"><span class="spin" id="sp"></span><span id="pTitle">正在生成本节资料…</span></div>
            <div class="pl" id="pl"></div>
          </div>
        </div>
      </div></div>
      <div class="foot"><div class="row">
        <input class="inp" placeholder="本节已结束（只读）" disabled>
        <button class="btn pri" disabled><svg class="ic" style="width:12px;height:12px"><use href="#i-stop"/></svg>结束课时</button>
      </div></div>
    </div>`, leftSide()+explorer())
  bind()
  const steps = [
    ['整理本节讲义 → 讲义.md', 900],
    ['提炼「掌握/遗留/建议」→ 交接.md', 1100],
    ['更新知识点进度', 600],
  ]
  const pl = document.getElementById('pl'); let i=0
  const run = ()=>{
    if(i>=steps.length){
      document.getElementById('sp').outerHTML = '<span style="color:var(--ok)"><svg class="ic" style="width:13px;height:13px"><use href="#i-check"/></svg></span>'
      document.getElementById('pTitle').textContent = '完成 · 讲义.md 与 交接.md 已落本课时夹'
      last.status='ended'
      toast('课时已结束：讲义 + 交接已生成')
      return
    }
    const [txt,ms]=steps[i]
    const el=document.createElement('div'); el.className='li'; el.innerHTML='<span class="spin"></span>'+txt; pl.appendChild(el)
    setTimeout(()=>{ el.innerHTML='<span style="color:var(--ok)"><svg class="ic" style="width:12px;height:12px"><use href="#i-check"/></svg></span>'+txt; i++; run() }, ms)
  }
  run()
}

/* ================= ④ 知识点收尾 ================= */
const QUIZ = [
  { q:'三阶行列式按第一行展开时，代数余子式 A₁₁ 等于？', o:['M₁₁','−M₁₁','M₁₂','−M₁₂'], a:0, e:'A₁₁ = (−1)^{1+1} M₁₁ = M₁₁。' },
  { q:'交换行列式的两行，行列式值如何变化？', o:['不变','变号','变为 0','翻倍'], a:1, e:'交换两行 → 行列式变号。' },
  { q:'若行列式某一行全为 0，则行列式值为？', o:['1','0','不确定','等于该行元素和'], a:1, e:'有一行全 0 → 行列式为 0。' },
]
let qi=0, picked=null, correct=0, judged=false
function renderFinish(){
  const u = unit(curUnit)
  if(qi===0 && !judged){ /* first */ }
  const q = QUIZ[qi]
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="main">
      <h1>收尾 · ${u.name}</h1>
      <div class="sub">课时全部结束 → 出测验 + 生成总结篇（用户主动 / AI 提议 混合触发）</div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:12px;color:var(--t2)">测验</span>
          <span style="flex:1;height:5px;border-radius:3px;background:var(--bg3);overflow:hidden"><span style="display:block;height:100%;width:${(qi/QUIZ.length)*100}%;background:var(--accent)"></span></span>
          <span style="font-size:11.5px;color:var(--t3)">${qi+1} / ${QUIZ.length}</span>
        </div>
        <div style="font-size:14px;font-weight:600;margin-bottom:12px">${q.q}</div>
        <div id="opts">
          ${q.o.map((o,i)=>`<div class="qopt" data-o="${i}"><span class="qk">${'ABCD'[i]}</span>${o}</div>`).join('')}
        </div>
        <div id="exp"></div>
        <div style="margin-top:12px;display:flex"><span style="flex:1"></span><button class="btn pri" id="qmain" disabled style="opacity:.5">提交</button></div>
      </div>
    </div>`, leftSide()+explorer())
  bind()
  const opts=document.getElementById('opts')
  opts.onclick=e=>{const o=e.target.closest('[data-o]'); if(!o||judged) return; picked=+o.dataset.o; opts.querySelectorAll('.qopt').forEach(x=>x.classList.toggle('pick',x===o)); const b=document.getElementById('qmain'); b.disabled=false; b.style.opacity='1'}
  document.getElementById('qmain').onclick=()=>{
    const b=document.getElementById('qmain')
    if(!judged){
      opts.querySelectorAll('.qopt').forEach(x=>{const i=+x.dataset.o; if(i===q.a)x.classList.add('right'); else if(i===picked)x.classList.add('wrong')})
      if(picked===q.a) correct++
      document.getElementById('exp').innerHTML=`<div class="note" style="color:var(--ok)">✓ ${q.e}</div>`
      judged=true; b.textContent = qi===QUIZ.length-1?'生成总结篇':'下一题'; b.style.opacity='1'
    } else {
      if(qi<QUIZ.length-1){ qi++; picked=null; judged=false; renderFinish() }
      else renderSummary()
    }
  }
}
function renderSummary(){
  const u = unit(curUnit); const u1=unit('u1')
  u.finished=true; u.status= correct===QUIZ.length?'mastered':'review'
  // 写入已完成知识点索引（引用网络）
  FINISHED[curUnit]={ title:u.name, digest:'（AI 归纳本知识点的方法与易错点）' }
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="main">
      <h1>${u.name} · 已收尾</h1>
      <div class="sub">测验 ${correct}/${QUIZ.length} · 掌握度 ${u.status==='mastered'?'100':'70'}% · 状态「${u.status==='mastered'?'已掌握':'待复习'}」</div>
      <div class="card">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:8px"><svg class="ic" style="width:12px;height:12px;vertical-align:-2px"><use href="#i-file"/></svg> 总结·${u.name}.md（已生成，进入引用网络）</div>
        <div class="summary">
          <b>核心方法</b>：按行展开 + 性质化简 + 特殊结构速算。<br>
          <b>易错点</b>：代数余子式符号 (−1)^{i+j}。<br>
          <b>关联</b>：<span class="jump" data-jump="u1">↩ 回顾《行列式的概念与阶数》</span>
        </div>
        <div class="note">总结篇落在知识点文件夹：<code style="color:var(--accent)">${folderOf(u)}/总结·${u.name}.md</code></div>
        <div style="margin-top:12px"><button class="btn gh" data-back="1">返回知识区</button></div>
      </div>
    </div>`, leftSide()+explorer())
  bind()
  document.querySelector('[data-jump]')?.addEventListener('click',()=>{curUnit='u1';curView='jump';renderJump('active')})
  document.querySelector('[data-back]')?.addEventListener('click',()=>{curView='ws';renderWs()})
}

/* ================= ⑤ 引用跳转 ================= */
function renderJump(mode){
  document.getElementById('stage').innerHTML = chrome(()=>`
    <div class="col chat">
      <div class="stream"><div class="inner" id="stream">
        <div class="a">
          <h3>引用跳转（两种触发）</h3>
          <p>演示：点击下面按钮，看 AI 如何在对话里给出「跳转到已结束知识点总结篇」的 chip。</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            <button class="btn gh sm" data-trig="active">模拟 · 主动（用户想回顾）</button>
            <button class="btn gh sm" data-trig="passive">模拟 · 被动（AI 发现完全不会）</button>
          </div>
        </div>
      </div></div>
      <div class="foot"><div class="row"><input class="inp" placeholder="输入…（Enter 发送）" disabled></div></div>
    </div>`, leftSide()+explorer())
  bind()
  document.querySelectorAll('[data-trig]').forEach(el=>el.onclick=()=>{
    const s=document.getElementById('stream'); const active = el.dataset.trig==='active'
    const u=document.createElement('div'); u.className='u'; u.textContent = active?'我想回顾一下「行列式的概念与阶数」':'（继续讲矩阵）'
    const a=document.createElement('div'); a.className='a'
    a.innerHTML = active
      ? `<h3>回顾链接</h3><p>你还记得这一节，我把当时的总结篇调出来：</p>
         <span class="jump" data-open-sum="u1"><svg class="ic" style="width:12px;height:12px"><use href="#i-right"/></svg>打开《行列式的概念与阶数》总结篇</span>
         <p class="note">主动触发：用户说想回顾 → AI 从「已完成知识点目录」命中 → 给跳转 chip。</p>`
      : `<h3>前置概念好像丢了</h3><p>你刚才把「代数余子式」当成了普通乘积——这一步依赖前面的定义，建议先回去看一眼：</p>
         <span class="jump" data-open-sum="u1"><svg class="ic" style="width:12px;height:12px"><use href="#i-right"/></svg>打开《行列式的概念与阶数》总结篇</span>
         <p class="note">被动触发：AI 判定你没掌握 → 也给出同一个跳转 chip（仅当该知识点「已结束」）。</p>`
    s.appendChild(u); s.appendChild(a); s.scrollTop=s.scrollHeight
    a.querySelector('[data-open-sum]').onclick=()=>openSummary()
  })
}
function openSummary(){
  const f=FINISHED['u1']
  const s=document.getElementById('stream')
  const a=document.createElement('div'); a.className='a'
  a.innerHTML=`<div class="summary"><b>《${f.title}》· 总结篇</b><br>${f.digest}<br><span class="note">（点击 chip → 复用 kb-open-note 跳到该知识点文件夹里的总结·xxx.md）</span></div>`
  s.appendChild(a); s.scrollTop=s.scrollHeight
}

/* ================= 路由 ================= */
const views = { ws:renderWs, lesson:()=>renderLesson(), ending:renderEnding, finish:renderFinish, jump:()=>renderJump('active') }
document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.switcher button').forEach(x=>x.classList.toggle('active',x===b))
  curView=b.dataset.v; qi=0; picked=null; judged=false; correct=0
  views[curView]()
})
renderWs()
</script>
</body>
</html>
