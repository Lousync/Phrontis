<style>
  :root {
    --bg: #f6f6f5; --surface: #ffffff; --border: #e4e4e2;
    --text: #22221f; --text-2: #55554f; --text-3: #7d7d76;

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #202022; --border: #303032;
      --text: #eeeeea; --text-2: #b6b6b0; --text-3: #8a8a84;
      --accent: #b5b5af; --accent-soft: #2b2b29; --accent-deep: #e6e6e1;

    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.75; font-size: 15px; }

  nav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 90%, transparent);

  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .nav-right a { font-size: 13.5px; color: var(--text-2); }
  .nav-right a:hover { color: var(--accent); }
  .searchbox { position: relative; width: min(320px, 40vw); }
  .searchbox input {
    width: 100%; padding: 7px 12px 7px 32px; border-radius: 8px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none;

  .results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;

  }
  .results.open { display: block; }
  .results .r-item { padding: 9px 14px; cursor: pointer; border-top: 1px solid var(--border); }
  .results .r-item:first-child { border-top: none; }
  .results .r-item:hover { background: var(--accent-soft); }
  .results .r-item .rt { font-size: 13.5px; font-weight: 500; }
  .results .r-item .rc { font-size: 11px; color: var(--text-3); }
  .results .r-empty { padding: 12px 14px; font-size: 12.5px; color: var(--text-3); }

  .layout { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 36px; align-items: flex-start; }
  aside { width: 232px; flex-shrink: 0; position: sticky; top: 58px; max-height: calc(100vh - 58px); overflow-y: auto; padding: 26px 0 40px; }
  aside .cat { font-size: 11.5px; color: var(--text-3); letter-spacing: .06em; margin: 18px 0 6px; }
  aside .cat:first-child { margin-top: 0; }
  aside a.dlink { display: block; padding: 5px 10px; border-radius: 7px; font-size: 13.5px; color: var(--text-2); border-left: 2px solid transparent; }
  aside a.dlink:hover { color: var(--text); background: var(--surface); }
  aside a.dlink.on { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 500; }
  @media (max-width: 880px) { aside { display: none; } }

  main { flex: 1; min-width: 0; padding: 30px 0 80px; }
  .crumb { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .doc-title { font-size: 27px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 6px; }
  .doc-meta { font-size: 12.5px; color: var(--text-3); margin-bottom: 26px; }
  .toc { width: 208px; flex-shrink: 0; position: sticky; top: 58px; max-height: calc(100vh - 58px); overflow-y: auto; padding: 34px 0 40px; }
  .toc-cap { font-size: 11.5px; color: var(--text-3); letter-spacing: .06em; margin-bottom: 8px; font-weight: 500; }
  .toc a { display: block; font-size: 12.5px; color: var(--text-2); padding: 4px 0 4px 12px; border-left: 2px solid var(--border); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc a.l3 { padding-left: 26px; font-size: 12px; color: var(--text-3); }
  .toc a:hover { color: var(--text); }
  .toc a.on { color: var(--accent); border-left-color: var(--accent); }
  .md h2, .md h3 { scroll-margin-top: 72px; }
  @media (max-width: 1150px) { .toc { display: none; } }
  .cat-group .cat { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .cat-group .chev { width: 11px; height: 11px; transition: transform .2s; }
  .cat-group:not(.open) .chev { transform: rotate(-90deg); }
  .cat-group:not(.open) .cat-items { display: none; }
  .cat-items { overflow: hidden; }

  .md { max-width: 760px; }
  .md h1 { font-size: 24px; font-weight: 600; margin: 30px 0 14px; }
  .md h2 { font-size: 19px; font-weight: 600; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .md h3 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; }
  .md p { margin: 10px 0; color: var(--text-2); }
  .md strong { color: var(--text); font-weight: 600; }
  .md a { color: var(--accent); }
  .md a:hover { text-decoration: underline; }
  .md code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 13px; font-family: Consolas, monospace; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 12px 0; }
  .md pre code { border: none; background: none; padding: 0; font-size: 12.5px; line-height: 1.7; }
  .md ul, .md ol { padding-left: 24px; margin: 10px 0; color: var(--text-2); }
  .md li { margin: 4px 0; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 12px 0; color: var(--text-3); }
  .md table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
  .md th { background: var(--code-bg); font-weight: 500; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
  .pager { display: flex; justify-content: space-between; gap: 14px; margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--border); }
  .pager a { font-size: 13px; color: var(--accent); }
  .pager a:hover { text-decoration: underline; }

{ slug:'install', title:'安装与首次启动', category:'入门', weight:1, icon:'📦', kw:'下载 安装包 NSIS 首次启动 引导',
md:`## 下载安装

从 [GitHub Releases](https://github.com/Lousync/Phrontis/releases) 下载最新的 \`Setup x64.exe\` 安装包，双击安装。支持自定义安装目录。

系统要求：**Windows 10 / 11（64 位）**。

## 首次启动

1. 启动后会进入**仓库选择页**——新建一个文件夹作为你的知识仓库（它就是你的账户）。
2. 跟着**新手引导**走一遍（约两分钟），可以在最后一步勾选你最常用的场景，图标条只保留你需要的模块。
3. 主题、字号、启动页都可以在引导里顺手设置，之后随时在「设置」中修改。

> 数据 100% 保存在本机，无需注册任何账号。

## 检查更新

标题栏出现下载图标即代表有新版本，点击直接下载，完成后一键安装。` },

{ slug:'vault', title:'仓库：一个文件夹就是你的账户', category:'入门', weight:2, icon:'🗄️', kw:'仓库 vault 换电脑 迁移 备份 文件夹',
md:`## 核心概念

Phrontis 没有"云端账户"——**一个文件夹就是一个仓库**：

- 正文内容是 \`.md\` 文件，任何编辑器都能打开；
- 结构化数据（任务、打卡、设置等）是仓库内 \`.knowbase/\` 目录下的 JSON 文件。

## 换电脑

把仓库文件夹整体拷贝到新电脑，安装 Phrontis 后在启动页选择"打开已有仓库"即可，历史数据原样归来。

## 备份

工具箱 → **数据导出** 可以把全部数据打包成一个 ZIP；把这个备份包拖回窗口就能完整还原。建议定期导出一份。

## 多仓库

可以创建多个仓库（比如"工作"与"个人"），启动页与标题栏切换器随时切换，互不干扰。` },

{ slug:'editor', title:'笔记：写作、阅读与撤销', category:'笔记', weight:1, icon:'✏️', kw:'笔记 Monaco 读写一体 禅模式 撤销 大纲 插图',
md:`## 写作

笔记区使用 **VS Code 同款 Monaco 内核**，左侧是仓库文件树。新建一篇直接写，**自动保存**，不用按 \`Ctrl+S\`。

- \`Ctrl+N\` 新建笔记（新建即入列，没有"先草稿后归档"这一步）；
- 底部状态栏实时显示语言、编码与保存状态。

## 读写一体

同一篇页面既能写也能读——标签、双链、反链与图谱都在笔记区里，不用在两个模块之间搬内容。

## 禅模式

\`Ctrl+K\` 然后 \`Z\` 进入禅模式——只留你和文字。\`Esc\` 退出。

## 撤销栈

文件操作（移动 / 重命名 / 新建）有独立撤销栈：

- \`Ctrl+Z\` 撤销、\`Ctrl+Shift+Z\` 重做；
- 手滑把文件拖错地方？一键回到事故之前。

## 大纲与插图

侧栏提供**大纲**（按标题层级跳转）与**插图**面板；直接粘贴剪贴板里的截图即可插入正文。` },

{ slug:'knowledge', title:'笔记：双链、反链与图谱', category:'笔记', weight:2, icon:'🧠', kw:'笔记 双链 反链 图谱 分类目录 沉浸阅读 ignore',
md:`## 分类目录

笔记按**分类目录**组织——页面的分类就是它所在的目录；新建分类目录、把笔记拖进去即完成归类。页面本身就是仓库里的 \`.md\` 文件。

## 双链与反链

写作时用 \`[[笔记名]]\` 引用其他笔记；被引用的笔记会自动积累**反向链接**。

- 阅读页面时右侧可以看到反链上下文；
- **知识图谱**用力导向布局展示整张网络，可进入某个目录只看局部；
- 相关性推荐会根据内容相似度提示可能相关的笔记。

## 沉浸阅读

\`Ctrl+Shift+R\` 进入沉浸阅读模式，隐藏一切干扰，适合长文与复习场景。

## .ignore 隐藏私人目录

在仓库根放一个 \`.ignore\` 文件（gitignore 语法），命中的目录会从笔记列表、搜索、图谱与 AI 检索中**整体隐藏**，不影响文件本身。

\`\`\`
私密/
草稿/
\`\`\`` },

{ slug:'books', title:'书架：PDF / TXT 阅读与摘录', category:'书架', weight:1, icon:'📚', kw:'书架 阅读器 PDF TXT 划选 摘录 高亮 翻译 阅读进度 扫描版',
md:`## 把书放进书架

PDF 与 TXT 文件放进仓库即可上架，书架支持**封面墙**与**三排列**两种摆法。

## 阅读

- **PDF 与 TXT 都是原生阅读器**，不必再用外部软件打开；
- \`Ctrl+滚轮\` 缩放页面，\`Ctrl+=\` / \`Ctrl+-\` / \`Ctrl+0\` 微调与复位；
- 再次打开会回到上次读到的位置——进度记住了。

## 划选与摘录

选中正文会弹出操作浮条：

- **AI 讲题**：把选中的这段交给 AI 讲一遍；
- **翻译**：就地翻译选中内容；
- **摘录**：存进右栏阅读面板，正文里留下**高亮**，点摘录可跳回原文；
- **复制**：复制到剪贴板。

## 扫描版

纯扫描件（正文没有文本层）打开时会给出提示，书架里带「扫描版」角标。` },

{ slug:'schedule', title:'日程：四象限与拖拽排期', category:'日程', weight:1, icon:'📅', kw:'日程 四象限 周视图 拖拽 排期 零碎任务 待安排 打卡',
md:`## 四种视图

顶栏可切换 **周日程 / 按日期 / 按截止 / 按象限** 四种视图，同一条任务在不同视角下管理。

## 零碎任务 vs 正式任务

- **零碎任务**（⚡）：当天创建当天完成，在"按日期"视图顶部的快速添加条输入回车即建；
- **正式任务**（计划 / 截止）：支持四象限优先级、子任务、周期重复与截止倒计时。

## 周日程拖拽排期

周日程视图下，左侧"待安排"栏的任务直接**拖进右侧时间网格**即完成排期，拖拽卡片边缘可调整时长；拖回待安排栏则取消排期。

## 今日工作台小窗

\`Ctrl+Alt+S\` 呼出贴边小窗：日程、打卡、番茄钟、常用导航四合一，逾期任务置顶提醒。` },

{ slug:'ai-setup', title:'AI 助手：配置你的模型', category:'AI 助手', weight:1, icon:'🤖', kw:'AI 助手 模型 Ollama 本地 OpenAI Anthropic 配置 CC Switch',
md:`## 打开 AI 助手

\`Ctrl+J\` 随时唤起 AI 侧栏；阅读笔记时，AI 会自动带上当前页面上下文——"边看边问"。

## 配置模型

设置 → **AI 工具** → 模型：

- **本地模型**：Ollama（\`http://localhost:11434\`），全程离线；
- **在线模型**：任何 OpenAI 兼容接口，或 Anthropic；
- 用过 CC Switch 的话可以**一键导入**已有配置，也支持自定义请求头。

## 工具调用

AI 不止会聊天——它可以调用本地工具（搜索笔记、创建任务、读写文件等），最多 8 轮推理，全程留痕，可在审计面板查看每一次调用。` },

{ slug:'ai-permission', title:'AI 权限：你来划线', category:'AI 助手', weight:2, icon:'🛡️', kw:'AI 权限 授权 禁止 只读 读写 审计 安全',
md:`## 三档权限

设置 → AI 工具 → **权限**，按模块给 AI 划线：

| 档位 | 行为 |
|------|------|
| 禁止 | 工具对 AI **完全不可见**，它不会去猜 |
| 只读 | 可以读，不能写 |
| 读写 | 可以读取并修改该模块 |

## 审计

AI 的每次工具调用都有记录（工具、参数、结果），在设置中可查完整审计链路——它做了什么，一目了然。

> 原则：AI 看不到你没授权的东西；你授权了什么，它才能碰什么。` },

{ slug:'toolbox', title:'工具箱：密码本与数据备份', category:'工具箱', weight:1, icon:'🧰', kw:'工具箱 密码本 DPAPI 数据导出 备份 局域网传输 番茄钟',
md:`工具箱内置 11 个常用工具，这里挑最常用的三个：

## 密码本

- 密码使用 **Windows DPAPI** 系统级加密存储；
- \`Ctrl+Alt+P\` 呼出全局快速填充悬浮窗，在任意网页一键填入；
- 复制密码后 30 秒自动清空剪贴板。

## 数据导出

按模块勾选导出备份包（ZIP）；**把备份包拖回窗口即可完整还原**。换电脑、重装系统的保底手段。

## 设备传输

局域网内扫码互传文件——手机照片传电脑、电脑文档传手机，不经过任何服务器。` },

{ slug:'plugins', title:'插件：市场与安全', category:'插件', weight:1, icon:'🧩', kw:'插件 市场 主题 安全审核 沙箱 签名 知识包',
md:`## 安装

插件页 → 官方市场，一键安装，支持自动更新。主题包、番茄预设、错题本等插件都在这里。

## 安全机制

- **三级审核**：所有上架插件按 S / A / B 分级，风险一目了然；
- **沙箱运行**：code 插件运行在 Worker 沙箱，能力经网关逐项授权，未授权调用一律拒绝并记录；
- **签名验签**：支持 ed25519 签名，插件来源可验证。

## 自己写一个

所有官方插件源码在 [Phrontis-plugins](https://github.com/Lousync/Phrontis-plugins) 仓库——declarative 知识包（教材 / 题库 / 速查）只需要准备内容，不写代码。欢迎提交。` },

{ slug:'shortcuts', title:'快捷键速查', category:'参考信息', weight:1, icon:'⌨️', kw:'快捷键 快速键 键盘',
md:`## 全局

| 快捷键 | 功能 |
|--------|------|
| \`Ctrl+N\` | 当前模块新建 |
| \`Ctrl+J\` | AI 助手侧栏 |
| \`Ctrl+B\` | 展开 / 收起侧边栏 |
| \`Ctrl+Shift+P\` | 命令面板 |
| \`Ctrl+O\` | 快速打开文件 |
| \`Ctrl+滚轮\` | 缩放界面 |

## 笔记

| 快捷键 | 功能 |
|--------|------|
| \`Ctrl+Shift+R\` | 沉浸阅读 |
| \`Ctrl+K Z\` | 禅模式 |
| \`Ctrl+Z\` / \`Ctrl+Shift+Z\` | 文件操作撤销 / 重做 |

## 小窗与工具

| 快捷键 | 功能 |
|--------|------|
| \`Ctrl+Alt+S\` | 日程与打卡小窗 |
| \`Ctrl+Alt+P\` | 密码快速填充 |

> 完整列表见应用内「设置菜单 → 帮助 → 快捷键」。` },

{ slug:'faq', title:'常见问题', category:'参考信息', weight:2, icon:'❓', kw:'FAQ 常见问题 数据安全 慢 丢失 恢复',

/* ===== Markdown 渲染（轻量，覆盖本文档所需） ===== */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>' })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
}
function renderMD(md) {
  var lines = esc(md).split('\n')
  var out = [], inCode = false, code = [], list = null, hid = 0, toc = []
  function flushList() { if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null } }
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i]
    if (/^```/.test(l)) {
      if (inCode) { out.push('<pre><code>' + code.join('\n') + '</code></pre>'); code = []; inCode = false }
      else { flushList(); inCode = true }
      continue
    }
    if (inCode) { code.push(l); continue }
    var h = l.match(/^(#{1,4})\s+(.*)/)
    if (h) {
      flushList()
      var lvl = h[1].length
      var idAttr = ''
      if (lvl === 2 || lvl === 3) {
        hid++
        var hidV = 'h-' + hid
        idAttr = ' id="' + hidV + '"'
        toc.push({ id: hidV, level: lvl, text: h[2].replace(/`/g, '').replace(/\*\*/g, '') })
      }
      out.push('<h' + lvl + idAttr + '>' + inline(h[2]) + '</h' + lvl + '>')
      continue
    }
    if (/^\s*[-*]\s+/.test(l)) { if (list === null) list = []; list.push('<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>'); continue }
    if (/^\s*$/.test(l)) { flushList(); continue }
    if (/^>\s?/.test(l)) { flushList(); out.push('<blockquote>' + inline(l.replace(/^>\s?/, '')) + '</blockquote>'); continue }
    if (/^---+$/.test(l)) { flushList(); out.push('<hr>'); continue }
    if (/^\|/.test(l)) {
      flushList()
      var cells = l.split('|').filter(function (c, idx, arr) { return !(idx === 0 && arr[0] === '') && !(idx === arr.length - 1 && arr[arr.length - 1] === '') })
      if (i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1])) {
        var head = '<tr>' + cells.map(function (c) { return '<th>' + inline(c.trim()) + '</th>' }).join('') + '</tr>'
        var rows = ''
        i += 2
        while (i < lines.length && /^\|/.test(lines[i])) {
          var rc = lines[i].split('|').slice(1, -1)
          rows += '<tr>' + rc.map(function (c) { return '<td>' + inline(c.trim()) + '</td>' }).join('') + '</tr>'
          i++
        }
        i--
        out.push('<table>' + head + rows + '</table>')
        continue
      }
    }
    flushList()
    out.push('<p>' + inline(l) + '</p>')
  }
  flushList()
  return { html: out.join('\n'), toc: toc }
}

/* ===== 侧栏与路由 ===== */
var CATS = []
DOCS.forEach(function (d) { if (CATS.indexOf(d.category) < 0) CATS.push(d.category) })

function buildSidebar(activeSlug) {
  var sb = document.getElementById('sidebar')
  var activeCat = null
  DOCS.forEach(function (d) { if (d.slug === activeSlug) activeCat = d.category })
  var expanded = JSON.parse(sessionStorage.getItem('kb-docs-open-cats') || 'null') || CATS
  if (typeof expanded === 'string') expanded = [expanded]
  var html = ''
  CATS.forEach(function (cat) {
    var items = DOCS.filter(function (d) { return d.category === cat }).sort(function (a, b) { return a.weight - b.weight })
    var open = expanded.indexOf(cat) >= 0
    html += '<div class="cat-group' + (open ? ' open' : '') + '" data-cat="' + cat + '">' +
      '<div class="cat" data-cat="' + cat + '">' + cat +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
      '</div>' +
      '<div class="cat-items">' +
      items.map(function (d) {
        return '<a class="dlink' + (d.slug === activeSlug ? ' on' : '') + '" href="#/' + d.slug + '">' + d.title + '</a>'
      }).join('') +
      '</div></div>'
  })
  sb.innerHTML = html
  sb.querySelectorAll('.cat').forEach(function (head) {
    head.onclick = function () {
      var g = head.closest('.cat-group')
      g.classList.toggle('open')
      var now = []
      sb.querySelectorAll('.cat-group.open').forEach(function (x) { now.push(x.getAttribute('data-cat')) })
      sessionStorage.setItem('kb-docs-open-cats', JSON.stringify(now))
    }
  })
}

function currentSlug() {
  var m = location.hash.match(/^#\/([a-z0-9-]+)/)
  return (m && DOCS.some(function (d) { return d.slug === m[1] })) ? m[1] : null
}

function render() {
  var slug = currentSlug() || DOCS[0].slug  // 无 hash 直接落第一篇，布局 = 左大纲 + 右正文
  var box = document.getElementById('content')
  var d = DOCS.filter(function (x) { return x.slug === slug })[0]
  buildSidebar(slug)
  var idx = DOCS.indexOf(d)
  var prev = DOCS[idx - 1], next = DOCS[idx + 1]
  var r = renderMD(d.md)
  var tocEl = document.getElementById('toc')
  if (r.toc.length) {
    tocEl.style.display = 'block'
    tocEl.innerHTML = '<div class="toc-cap">本页目录</div>' + r.toc.map(function (t) {
      return '<a class="toc-l' + (t.level === 3 ? ' l3' : '') + '" data-tid="' + t.id + '" href="#' + t.id + '">' + t.text + '</a>'
    }).join('')
  } else { tocEl.style.display = 'none'; tocEl.innerHTML = '' }
  box.innerHTML = '<div class="crumb">' + d.category + '</div>' +
    '<div class="doc-title">' + d.icon + ' ' + d.title + '</div>' +
    '<div class="doc-meta">Phrontis</div>' +
    '<div class="md">' + r.html + '</div>' +
    '<div class="pager">' +
    (prev ? '<a href="#/' + prev.slug + '">← ' + prev.title + '</a>' : '<span></span>') +
    (next ? '<a href="#/' + next.slug + '">' + next.title + ' →</a>' : '<span></span>') +
    '</div>'
  box.scrollIntoView && window.scrollTo(0, 0)
}

window.addEventListener('hashchange', function () { if (location.hash.indexOf('#/') === 0) render() })

var spyRAF = false
window.addEventListener('scroll', function () {
  if (spyRAF) return; spyRAF = true
  requestAnimationFrame(function () {
    spyRAF = false
    var links = document.querySelectorAll('#toc a')
    if (!links.length) return
    var heads = document.querySelectorAll('.md h2[id], .md h3[id]')
    var cur = heads.length ? heads[0].getAttribute('id') : null
    heads.forEach(function (h) { if (h.getBoundingClientRect().top <= 92) cur = h.getAttribute('id') })
    links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-tid') === cur) })
  })
})
render()

/* ===== 搜索 ===== */
var si = document.getElementById('searchInput'), rs = document.getElementById('results')
si.addEventListener('input', function () {
  var q = si.value.trim().toLowerCase()
  if (!q) { rs.classList.remove('open'); rs.innerHTML = ''; return }
  var hits = DOCS.map(function (d) {
    var hay = (d.title + ' ' + d.kw + ' ' + d.md).toLowerCase()
    var score = 0
    if (d.title.toLowerCase().indexOf(q) >= 0) score += 10
    if (d.kw.toLowerCase().indexOf(q) >= 0) score += 6
    if (hay.indexOf(q) >= 0) score += 2
    return { d: d, score: score }
  }).filter(function (x) { return x.score > 0 }).sort(function (a, b) { return b.score - a.score }).slice(0, 8)
  rs.innerHTML = hits.length
    ? hits.map(function (x) {
        return '<div class="r-item" data-slug="' + x.d.slug + '"><div class="rt">' + x.d.icon + ' ' + x.d.title + '</div><div class="rc">' + x.d.category + '</div></div>'
      }).join('')
    : '<div class="r-empty">没有匹配「' + esc(si.value.trim()) + '」的文档</div>'
  rs.classList.add('open')
})
rs.addEventListener('click', function (e) {
  var item = e.target.closest('.r-item')
  if (!item) return
  location.hash = '#/' + item.getAttribute('data-slug')
  si.value = ''; rs.classList.remove('open')
})
document.addEventListener('click', function (e) { if (!e.target.closest('.searchbox')) rs.classList.remove('open') })
</script>
