<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="鲸鱼娘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4a9e"/>
      <stop offset="1" stop-color="#0e1c3c"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#4c8fd6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- 呆毛 -->
  <path d="M30 15c-4-5-8-4-8-1 0 2 3 3 5 2" fill="none" stroke="#bfe7ff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 鲸尾 -->
  <path d="M40 40c6 2 8 8 7 13-3-1-6-3-8-6-2 3-5 5-8 6 1-5 3-10 9-13z" fill="url(#tail)"/>
  <!-- 身体 / 女仆裙 -->
