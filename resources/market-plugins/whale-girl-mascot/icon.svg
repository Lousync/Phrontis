  <path d="M30 36c1.5 0 2 1 3 1s1.5-1 3-1c0 2-1.5 3-3 3s-3-1-3-3z" fill="#6fb6ef"/>
  <!-- 头 -->
  <circle cx="32" cy="24" r="9" fill="#e8f1ff"/>
  <path d="M23 24a9 9 0 0 1 18 0c0 2-2 2-2 0 0-3-3-5-7-5s-7 2-7 5c0 2-2 2-2 0z" fill="#bcd9f7"/>
  <!-- 眼睛 -->
  <circle cx="29" cy="25" r="1.6" fill="#1d3f7a"/>
  <circle cx="35" cy="25" r="1.6" fill="#1d3f7a"/>
  <!-- 领结 -->
  <path d="M28 30l4 2 4-2-1 3-3 1-3-1z" fill="#7fc8ff"/>
</svg>
